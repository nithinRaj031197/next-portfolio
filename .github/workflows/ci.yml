name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public, non-secret values. They are placeholders: the build only needs *an* origin (see next.config.mjs), and the
# résumé URL is never fetched. Real deployments set their own values in the hosting platform, not here.
env:
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_PUBLIC_RESUME_URL: https://example.com/resume.pdf

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Built once, shared by every browser job below.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      PW_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # `CI` makes playwright.config.ts add the WebKit projects; --project picks the browsers for this matrix leg.
      - name: Chromium (desktop + mobile)
        if: matrix.browser == 'chromium'
        run: npx playwright test --project=desktop --project=mobile
      - name: WebKit (desktop + mobile; WebGL specs are opt-in until verified)
        if: matrix.browser == 'webkit'
        run: npx playwright test --project=webkit-desktop --project=webkit-mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
